services:
  calendar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetingloop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meetingloop
    volumes:
      - calendar-db-data:/var/lib/postgresql/data
      - ../../../data/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../../../data/migrations/001_user_availability.sql:/docker-entrypoint-initdb.d/002_availability.sql:ro
      - ../../../data/migrations/002_action_items_dependencies.sql:/docker-entrypoint-initdb.d/003_dependencies.sql:ro
      - ../../../data/migrations/003_calendar_events.sql:/docker-entrypoint-initdb.d/004_calendar_events.sql:ro
      - ../../../data/migrations/004_meeting_schedule_changes.sql:/docker-entrypoint-initdb.d/005_schedule_changes.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  calendar-service:
    build: .
    environment:
      PORT: 3010
      DB_HOST: calendar-db
      DB_PORT: 5432
      DB_NAME: meetingloop
      DB_USER: postgres
      DB_PASSWORD: meetingloop
    ports:
      - "3010:3010"
    depends_on:
      calendar-db:
        condition: service_healthy

volumes:
  calendar-db-data:
