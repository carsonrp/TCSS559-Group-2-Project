openapi: 3.0.3
info:
  title: MeetingLoop Notification Service API
  version: 1.0.0
  description: >
    Independently deployable email notification HTTP service. Meeting Management
    invokes this service over REST; SMTP configuration and provider credentials
    are owned by this service and are not part of the MeetingLoop API.
servers:
  - url: http://localhost:3020
tags:
  - name: Notifications
paths:
  /notifications/{type}:
    post:
      tags: [Notifications]
      summary: Send a meeting lifecycle notification
      description: >
        Requires the shared internal bearer token. Supported event types are
        created, updated, deleted, blocked, and rescheduled.
      security:
        - InternalBearer: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [created, updated, deleted, blocked, rescheduled]
          example: rescheduled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
            example:
              meeting:
                id: 17
                title: Sprint Planning
                start_time: '2026-11-18T10:00:00Z'
                end_time: '2026-11-18T11:00:00Z'
                organizer_id: 1
                organizer:
                  name: Alex Kim
                  email: alex@example.com
                attendees:
                  - name: Sam Lee
                    email: sam@example.com
              old_time: '2026-11-18T09:00:00Z'
              new_time: '2026-11-18T10:00:00Z'
              reason: Parent meeting was rescheduled
      responses:
        '202':
          description: The email notification was accepted and sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sent]
                    properties:
                      sent:
                        type: boolean
                        example: true
              example:
                data:
                  sent: true
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          description: Missing or invalid internal bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Configured email provider failed to deliver the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Internal credentials or SMTP provider are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
  schemas:
    NotificationRequest:
      type: object
      required: [meeting]
      properties:
        meeting:
          type: object
          required: [title]
          properties:
            id:
              type: integer
            title:
              type: string
            start_time:
              type: string
              format: date-time
            end_time:
              type: string
              format: date-time
            organizer_id:
              type: integer
            organizer:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
            attendees:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                    format: email
        old_meeting:
          type: object
        old_time:
          type: string
          format: date-time
        new_time:
          type: string
          format: date-time
        reason:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
  responses:
    InvalidJson:
      description: Invalid JSON request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
