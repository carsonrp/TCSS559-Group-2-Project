openapi: 3.0.3
info:
  title: MeetingLoop Meeting Insights API
  version: 1.0.0
  description: Meeting statistics exposed through Meeting Management REST APIs.
servers:
  - url: http://localhost:3000
tags:
  - name: Meeting insights
paths:
  /api/insights/summary:
    get:
      tags: [Meeting insights]
      summary: Get meeting statistics for an inclusive date range
      description: >
        Includes every meeting where start_time is less than or equal to end and
        end_time is greater than or equal to start. Attendee and participant
        statistics count meeting_attendees assignments; meeting organizers are
        not included unless they are also attendees.
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive beginning of the reporting date-time range.
          schema:
            type: string
            format: date-time
          example: '2026-11-01T00:00:00Z'
        - name: end
          in: query
          required: true
          description: Inclusive end of the reporting date-time range; must be at or after start.
          schema:
            type: string
            format: date-time
          example: '2026-11-30T23:59:59Z'
      responses:
        '200':
          description: Aggregated meeting and attendee statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingSummary'
              example:
                dateRange:
                  start: '2026-11-01T00:00:00.000Z'
                  end: '2026-11-30T23:59:59.000Z'
                totals:
                  meetings: 25
                  attendees: 87
                  uniquePeople: 19
                attendance:
                  averageAttendeesPerMeeting: 3.48
                by_status:
                  scheduled: 12
                  completed: 10
                  cancelled: 3
                by_department:
                  Engineering: 15
                  Product: 8
                  Operations: 2
                people:
                  - userId: 1
                    name: John Smith
                    meetingCount: 12
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/insights/meetings/{id}:
    get:
      tags: [Meeting insights]
      summary: Get insights for one meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 17
      responses:
        '200':
          description: Meeting details and attendee statistics.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MeetingInsights'
              example:
                data:
                  meetingId: 17
                  title: Sprint Planning
                  status: scheduled
                  time:
                    start: '2026-11-18T10:00:00.000Z'
                    end: '2026-11-18T11:00:00.000Z'
                  attendance:
                    totalAttendees: 5
                    requiredAttendees: 3
                    optionalAttendees: 2
                  departments:
                    Engineering: 3
                    Product: 2
                  attendees:
                    - userId: 1
                      name: John Smith
                      department: Engineering
                      required: true
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  schemas:
    DateRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    PersonRanking:
      type: object
      required: [userId, name, meetingCount]
      properties:
        userId:
          type: integer
        name:
          type: string
        meetingCount:
          type: integer
    MeetingSummary:
      type: object
      required: [dateRange, totals, attendance, by_status, by_department, people]
      properties:
        dateRange:
          $ref: '#/components/schemas/DateRange'
        totals:
          type: object
          required: [meetings, attendees, uniquePeople]
          properties:
            meetings:
              type: integer
            attendees:
              type: integer
            uniquePeople:
              type: integer
        attendance:
          type: object
          required: [averageAttendeesPerMeeting]
          properties:
            averageAttendeesPerMeeting:
              type: number
              format: double
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_department:
          type: object
          additionalProperties:
            type: integer
          description: Null departments are grouped under Unassigned.
        people:
          type: array
          items:
            $ref: '#/components/schemas/PersonRanking'
    MeetingInsights:
      type: object
      required: [meetingId, title, status, time, attendance, departments, attendees]
      properties:
        meetingId:
          type: integer
        title:
          type: string
        status:
          type: string
        time:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        attendance:
          type: object
          required: [totalAttendees, requiredAttendees, optionalAttendees]
          properties:
            totalAttendees:
              type: integer
            requiredAttendees:
              type: integer
            optionalAttendees:
              type: integer
        departments:
          type: object
          additionalProperties:
            type: integer
          description: Null departments are grouped under Unassigned.
        attendees:
          type: array
          items:
            type: object
            required: [userId, name, required]
            properties:
              userId:
                type: integer
              name:
                type: string
              department:
                type: string
                nullable: true
              required:
                type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
  responses:
    NotFound:
      description: The requested meeting does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MEETING_NOT_FOUND
              message: Meeting with id 999 was not found
              details:
                meeting_id: 999
    ValidationError:
      description: Missing or invalid query parameters or meeting id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - field: start
                  message: start must be a valid ISO 8601 date-time
                  location: query
